name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps is required because peerjs 1.4.7 has peer-dep
        # ranges that npm 7+ rejects without it.
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint -- --max-warnings 50

      - name: Run tests
        run: npm test -- --watchAll=false --ci --coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size budgets
        run: npm run check:bundle-budget

  e2e:
    name: E2E flows (Playwright)
    runs-on: ubuntu-latest

    env:
      # Makes playwright.config.js start a fresh server instead of reusing one.
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Only the functional flow specs: e2e/visual has no committed screenshot
      # baselines, so toHaveScreenshot would always fail there.
      - name: Run e2e flow specs
        run: npx playwright test e2e/flows

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
